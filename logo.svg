<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 320" fill="none" role="img" aria-labelledby="title desc">
<title id="title">UL Tracker</title>
<desc id="desc">Angular white and emerald UL monogram</desc>
<defs>
